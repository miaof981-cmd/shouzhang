<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>麦子生长演示</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #fffaf8;
  background-image:
    radial-gradient(ellipse at 10% 20%, rgba(249,196,207,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(184,221,200,0.15) 0%, transparent 50%);
  color: #3a3030;
  font-family: 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 48px 24px 60px;
}

h1 {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 26px;
  color: #b5606e;
  margin-bottom: 8px;
  text-align: center;
}
.subtitle {
  font-size: 13px;
  color: #a09090;
  margin-bottom: 52px;
  text-align: center;
  letter-spacing: 0.06em;
}

/* ── 种下动画区 ── */
#plant-section {
  margin-bottom: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
.section-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: #a09090;
  text-transform: uppercase;
}

.pa-scene {
  width: 200px;
  height: 200px;
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.pa-sky {
  position: absolute;
  top: 0; left: 0; right: 0; height: 58%;
  background: radial-gradient(ellipse at 50% -10%, #1e3a1e 0%, #080f08 100%);
}
.pa-star {
  position: absolute;
  border-radius: 50%;
  background: white;
}
.pa-earth {
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 46%;
  background: linear-gradient(180deg, #7a5230 0%, #3a200a 100%);
}
.pa-earth-top {
  position: absolute;
  top: -6px; left: -10%; width: 120%; height: 14px;
  background: #8b6040;
  border-radius: 50%;
}
.pa-seed-el {
  position: absolute;
  left: 50%;
  top: -24px;
  transform: translateX(-50%);
  opacity: 0;
}
.pa-ripple {
  position: absolute;
  left: 50%;
  top: 108px;
  transform: translateX(-50%);
  width: 8px; height: 4px;
  border-radius: 50%;
  background: rgba(120,80,40,0.75);
  opacity: 0;
}
.pa-sprout-el {
  position: absolute;
  left: 50%;
  bottom: 42%;
  transform: translateX(-50%) scale(0) translateY(10px);
  opacity: 0;
  transform-origin: bottom center;
}

/* animations */
@keyframes paTwinkle { 0%,100%{opacity:0.2;} 50%{opacity:1;} }

.running .pa-seed-el {
  animation: paSeedFall 1.05s cubic-bezier(0.3,0,0.7,1) 0.4s forwards;
}
@keyframes paSeedFall {
  0%   { top:-24px; opacity:1; transform:translateX(-50%) rotate(0deg) scale(1); }
  52%  { top:90px;  opacity:1; transform:translateX(-50%) rotate(170deg) scale(1); }
  65%  { top:80px;  transform:translateX(-50%) rotate(162deg) scale(1.05); }
  78%  { top:96px;  opacity:0.5; transform:translateX(-50%) rotate(174deg) scale(0.75); }
  100% { top:106px; opacity:0; transform:translateX(-50%) rotate(180deg) scale(0.3); }
}
.running .pa-ripple {
  animation: paRipple 0.55s ease-out 1.18s forwards;
}
@keyframes paRipple {
  0%   { opacity:0.9; width:8px; height:4px; }
  100% { opacity:0;   width:58px; height:10px; top:104px; }
}
.running .pa-sprout-el {
  animation: paSprout 0.75s cubic-bezier(0.34,1.56,0.64,1) 1.45s forwards;
}
@keyframes paSprout {
  0%   { opacity:0; transform:translateX(-50%) scale(0.1) translateY(12px); }
  65%  { opacity:1; transform:translateX(-50%) scale(1.15) translateY(-3px); }
  100% { opacity:1; transform:translateX(-50%) scale(1) translateY(0); }
}

.play-btn {
  padding: 11px 28px;
  background: white;
  border: 1.5px solid #f0e0e4;
  border-radius: 24px;
  color: #6a5858;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
  letter-spacing: 0.04em;
}
.play-btn:hover { background: #e4f4eb; border-color: #84c4a0; color: #3d8a60; }

/* ── 生长阶段展示 ── */
#stages-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  width: 100%;
  max-width: 780px;
}

.stages-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: flex-end;
  flex-wrap: wrap;
}

.stage-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.stage-card:hover { transform: translateY(-4px); }

.stage-card.active { transform: translateY(-8px) scale(1.05); }

.stage-box {
  border-radius: 16px;
  padding: 14px 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  transition: all 0.35s;
  min-width: 76px;
}
.stage-card.active .stage-box {
  border-color: rgba(132,196,160,0.7);
  background: rgba(228,244,235,0.72);
  box-shadow: 0 0 20px rgba(132,196,160,0.2);
}
.stage-card.gold .stage-box {
  background: linear-gradient(145deg, #fff7df 0%, #ffeac0 100%);
  border-color: #d4a017;
}
.stage-card.gold.active .stage-box {
  box-shadow: 0 0 30px rgba(212,160,23,0.5), 0 0 0 1px rgba(240,210,80,0.3);
}

.stage-name {
  font-size: 11px;
  font-weight: 500;
  color: #8a7777;
  text-align: center;
  line-height: 1.5;
  transition: color 0.3s;
}
.stage-card.active .stage-name { color: #3d8a60; }
.stage-card.gold .stage-name { color: #a07010; }
.stage-card.gold.active .stage-name { color: #a07010; }

.stage-time {
  font-size: 9px;
  color: #a09090;
  text-align: center;
  margin-top: 2px;
  transition: color 0.3s;
}
.stage-card.active .stage-time { color: #6a5858; }
.stage-card.gold.active .stage-time { color: #b18418; }

/* 播放条 */
.progress-track {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.progress-bar-wrap {
  width: 100%;
  height: 3px;
  background: #f0e0e4;
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #84c4a0, #d4a017);
  border-radius: 2px;
  width: 0%;
  transition: width 0.8s ease;
}
.progress-controls {
  display: flex;
  gap: 10px;
  align-items: center;
}
.ctrl-btn {
  padding: 8px 20px;
  background: white;
  border: 1.5px solid #f0e0e4;
  border-radius: 20px;
  color: #6a5858;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.ctrl-btn:hover { background: #e4f4eb; border-color: #84c4a0; color: #3d8a60; }
.ctrl-btn.primary {
  background: #e4f4eb;
  border-color: #84c4a0;
  color: #3d8a60;
}
.ctrl-btn.primary:hover { background: #d8eedf; }

/* 书架卡片演示 */
#card-demo {
  margin-top: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 100%;
  max-width: 780px;
}
.card-demo-row {
  display: flex;
  gap: 24px;
  align-items: flex-end;
  flex-wrap: wrap;
  justify-content: center;
}
.demo-book {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.demo-book-cover {
  width: 90px;
  height: 120px;
  border-radius: 4px 10px 10px 4px;
  background: linear-gradient(135deg, #fde8ec, #ffe8f0);
  box-shadow: 0 3px 14px rgba(249,196,207,0.5), -3px 0 0 #f9c4cf, -5px 0 0 #e8a0ad;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  transition: box-shadow 0.4s, border 0.4s;
}
.demo-book-cover.harvest {
  border: 1px solid rgba(212,160,23,0.45);
  background: linear-gradient(145deg, #fff1f3 0%, #fff7df 54%, #ffeac0 100%);
  box-shadow:
    0 6px 28px rgba(212,160,23,0.34),
    -3px 0 0 #e6bd4e,
    -5px 0 0 #ad7a10,
    inset 0 0 26px rgba(212,160,23,0.12);
}
.demo-book-cover.harvest::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(184,126,10,0.28);
  border-radius: 3px 8px 8px 3px;
  pointer-events: none;
  z-index: 5;
}
.demo-book-num {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 28px;
  color: rgba(229,160,173,0.4);
}
.demo-book-cover.harvest .demo-book-num {
  color: rgba(176,116,12,0.36);
}
.book-badge {
  position: absolute;
  bottom: 7px;
  right: 7px;
  z-index: 12;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
  pointer-events: none;
}
.demo-book-cover.harvest .book-badge {
  bottom: 9px;
  right: 8px;
  transform: scale(0.72);
  opacity: 0.78;
  z-index: 11;
}
.wh-harvest-frame {
  position: absolute;
  left: -3px;
  top: -3px;
  width: calc(100% + 6px);
  height: calc(100% + 6px);
  z-index: 8;
  overflow: visible;
  pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(110,72,10,0.22));
}
.demo-book-label {
  font-size: 10px;
  color: #8a7777;
  text-align: center;
  line-height: 1.5;
}

/* 麦子晃动 */
@keyframes wheatSway {
  0%,100% { transform: rotate(0deg); }
  30%  { transform: rotate(-4.5deg); }
  70%  { transform: rotate(4.5deg); }
}
.wh-sway {
  animation: wheatSway 2.8s ease-in-out infinite;
  transform-origin: 50% 100%;
  transform-box: fill-box;
}

/* divider */
.divider {
  width: 100%;
  max-width: 480px;
  height: 1px;
  background: #f0e0e4;
  margin: 48px 0 0;
}
</style>
</head>
<body>

<h1>麦子生长演示</h1>
<div class="subtitle">WHEAT GROWTH · 种下到金穗的完整历程</div>

<!-- 1. 种下动画 -->
<div id="plant-section">
  <div class="section-label">① 种下动画</div>
  <div class="pa-scene" id="pa-scene">
    <div class="pa-sky">
      <div class="pa-star" style="width:2px;height:2px;top:18%;left:20%;animation:paTwinkle 1.8s ease-in-out 0.1s infinite;"></div>
      <div class="pa-star" style="width:1.5px;height:1.5px;top:32%;left:68%;animation:paTwinkle 2.3s ease-in-out 0.7s infinite;"></div>
      <div class="pa-star" style="width:2px;height:2px;top:14%;left:55%;animation:paTwinkle 1.6s ease-in-out 0.4s infinite;"></div>
      <div class="pa-star" style="width:1px;height:1px;top:44%;left:35%;animation:paTwinkle 2s ease-in-out 1.1s infinite;"></div>
      <div class="pa-star" style="width:1.5px;height:1.5px;top:22%;left:80%;animation:paTwinkle 2.5s ease-in-out 0.3s infinite;"></div>
    </div>
    <div class="pa-earth"><div class="pa-earth-top"></div></div>
    <div class="pa-seed-el" id="pa-seed"></div>
    <div class="pa-ripple" id="pa-ripple"></div>
    <div class="pa-sprout-el" id="pa-sprout"></div>
  </div>
  <button class="play-btn" id="play-plant-btn" onclick="playPlant()">▶ 播放种下动画</button>
</div>

<div class="divider"></div>

<!-- 2. 六阶段生长 -->
<div id="stages-section" style="margin-top:48px;">
  <div class="section-label">② 六个生长阶段（点击任意阶段查看）</div>
  <div class="stages-row" id="stages-row"></div>
  <div class="progress-track">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="prog-fill"></div>
    </div>
    <div class="progress-controls">
      <button class="ctrl-btn primary" onclick="autoPlayStages()">▶ 自动播放</button>
      <button class="ctrl-btn" onclick="prevStage()">← 上一阶段</button>
      <button class="ctrl-btn" onclick="nextStage()">下一阶段 →</button>
    </div>
  </div>
</div>

<div class="divider"></div>

<!-- 3. 书架卡片展示 -->
<div id="card-demo" style="margin-top:48px;">
  <div class="section-label">③ 书架封面角标 & 丰收边框</div>
  <div class="card-demo-row" id="card-row"></div>
</div>

<script>
// ── SVG 麦子生成（与主文件完全一致） ──
function wheatSVG(idx, w, h, sway) {
  const vw = 28, vh = 64;
  const wa = `width="${w}" height="${h}"`;
  const soil = (c1 = '#8b6040', c2 = '#6f4526') =>
    `<ellipse cx="14" cy="59" rx="12" ry="3.8" fill="${c1}" opacity="0.95"/>` +
    `<ellipse cx="14" cy="57.5" rx="8.2" ry="2" fill="${c2}" opacity="0.58"/>`;
  const stem = (d, c, sw = 1.55, op = 1) =>
    `<path d="${d}" stroke="${c}" stroke-width="${sw}" fill="none" stroke-linecap="round" opacity="${op}"/>`;
  const leaf = (d, c, sw = 1.35, op = 1) => stem(d, c, sw, op);
  const wheatHead = (stemC, grainC, awnC, glow = false) => `
      <line x1="14" y1="30" x2="14" y2="9" stroke="${stemC}" stroke-width="1.25" stroke-linecap="round"/>
      <path d="M14 30 C13.3 23 13.5 15 14 9" stroke="rgba(255,255,255,0.45)" stroke-width="0.35" fill="none" opacity="${glow ? 0.55 : 0.25}"/>
      <path d="M10.4 30 L5.8 21 M17.6 30 L22.2 21 M9.8 25 L4.5 15 M18.2 25 L23.5 15 M10.3 20 L5.5 10 M17.7 20 L22.5 10 M14 10 L14 3.5" stroke="${awnC}" stroke-width="0.72" stroke-linecap="round" opacity="0.9"/>
      <ellipse cx="10.6" cy="30" rx="3.2" ry="1.35" transform="rotate(-31 10.6 30)" fill="${grainC}"/>
      <ellipse cx="17.4" cy="30" rx="3.2" ry="1.35" transform="rotate(31 17.4 30)" fill="${grainC}"/>
      <ellipse cx="9.8" cy="25.6" rx="3" ry="1.28" transform="rotate(-34 9.8 25.6)" fill="${grainC}"/>
      <ellipse cx="18.2" cy="25.6" rx="3" ry="1.28" transform="rotate(34 18.2 25.6)" fill="${grainC}"/>
      <ellipse cx="10.2" cy="21.4" rx="2.65" ry="1.18" transform="rotate(-38 10.2 21.4)" fill="${grainC}"/>
      <ellipse cx="17.8" cy="21.4" rx="2.65" ry="1.18" transform="rotate(38 17.8 21.4)" fill="${grainC}"/>
      <ellipse cx="11.2" cy="17.2" rx="2.35" ry="1.08" transform="rotate(-35 11.2 17.2)" fill="${grainC}" opacity="0.96"/>
      <ellipse cx="16.8" cy="17.2" rx="2.35" ry="1.08" transform="rotate(35 16.8 17.2)" fill="${grainC}" opacity="0.96"/>
      <ellipse cx="14" cy="12" rx="2.4" ry="1.08" fill="${grainC}"/>
      ${glow ? '<path d="M11.5 28.8 C12.8 26 12.9 18 13.7 11" stroke="#fff0b8" stroke-width="0.55" fill="none" opacity="0.55" stroke-linecap="round"/>' : ''}
    `;

  if (idx === 0) return `<svg viewBox="0 0 ${vw} ${vh}" ${wa} xmlns="http://www.w3.org/2000/svg">
    ${soil()}
    <ellipse cx="14" cy="54.2" rx="3" ry="1.65" transform="rotate(-12 14 54.2)" fill="#c9a05a" opacity="0.88"/>
    <path d="M12.5 53.8 Q14 52.8 15.8 53.8" stroke="#f1d38a" stroke-width="0.45" fill="none" opacity="0.65"/>
  </svg>`;

  if (idx === 1) return `<svg viewBox="0 0 ${vw} ${vh}" ${wa} xmlns="http://www.w3.org/2000/svg">
    ${soil()}
    ${stem('M14 56 C13.5 51 13.6 46 14.4 39', '#b9d884', 1.6)}
    ${leaf('M14 48 C10.5 45 9.5 42 9.1 38.8', '#b9d884', 1.15, 0.9)}
  </svg>`;

  if (idx === 2) return `<svg viewBox="0 0 ${vw} ${vh}" ${wa} xmlns="http://www.w3.org/2000/svg">
    ${soil()}
    ${stem('M14 56 C13.2 49 13.5 41 14.2 33', '#78b840', 1.85)}
    ${leaf('M14 48 C8.5 45 6.2 40.5 5.4 35.8', '#7fbd45', 1.35)}
    ${leaf('M14.1 43 C19.4 39.5 21.6 35.5 22.3 30.8', '#7fbd45', 1.35)}
    <circle cx="14" cy="45" r="1" fill="#9bce62" opacity="0.85"/>
  </svg>`;

  if (idx === 3) {
    const c = '#4f920c';
    return `<svg viewBox="0 0 ${vw} ${vh}" ${wa} xmlns="http://www.w3.org/2000/svg">
      ${soil()}
      ${stem('M14 56 C13 47 13.3 35 14.2 23', c, 1.95)}
      ${leaf('M14 50 C7.2 46.5 3.4 40.5 2.6 34.2', c, 1.55)}
      ${leaf('M14 41 C20.8 37.2 24.2 31.4 25.2 25.2', c, 1.55)}
      ${leaf('M14.1 28 C18 23.2 19.4 18.5 19.1 14.2', '#67aa1f', 1.25)}
      <circle cx="14" cy="39" r="1.25" fill="#6cad24"/>
      <circle cx="14" cy="30" r="0.95" fill="#6cad24" opacity="0.8"/>
    </svg>`;
  }

  if (idx === 4) {
    const c = '#6b9a20', g = '#91be30';
    return `<svg viewBox="0 0 ${vw} ${vh}" ${wa} xmlns="http://www.w3.org/2000/svg">
      ${soil('#8b6040','#73502c')}
      ${stem('M14 56 C12.9 47 13.2 37 14 30', c, 1.9)}
      ${leaf('M14 50 C6.8 46.5 3.8 40.2 3 33.5', c, 1.45)}
      ${leaf('M14 41 C21.6 37.8 24.4 31.8 25 25.4', c, 1.45)}
      ${wheatHead(c, g, '#6f9820', false)}
    </svg>`;
  }

  const c = '#bd8508', g = '#d8a318';
  const swayClass = sway ? 'class="wh-sway"' : '';
  return `<svg viewBox="0 0 ${vw} ${vh}" ${wa} xmlns="http://www.w3.org/2000/svg">
    <g ${swayClass} style="transform-origin:14px 59px;transform-box:fill-box;">
      ${soil('#a07030','#8d5f1e')}
      ${stem('M14 56 C12.9 47 13.15 37 14 30', c, 1.95)}
      ${leaf('M14 50 C7.4 47.3 4.2 41.4 3.1 34.6', '#c28b12', 1.45)}
      ${leaf('M14 41.5 C21.2 38.5 24.1 32.6 25 26', '#c28b12', 1.45)}
      ${wheatHead(c, g, '#b67806', true)}
    </g>
  </svg>`;
}

function harvestFrameSVG() {
  return `<svg class="wh-harvest-frame" viewBox="0 0 100 132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M12 15 H38 M12 15 V42 M88 15 H62 M88 15 V42 M12 117 V90 M12 117 H38 M88 117 V90 M88 117 H62" fill="none" stroke="#f4d77a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 22 H35 M18 22 V39 M82 22 H65 M82 22 V39 M18 110 V93 M18 110 H35 M82 110 V93 M82 110 H65" fill="none" stroke="#9f6b08" stroke-width="0.85" stroke-linecap="round" opacity="0.62"/>
    <path d="M20 115 C7 95 7 50 21 17" fill="none" stroke="#9d6b09" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M80 115 C93 95 93 50 79 17" fill="none" stroke="#9d6b09" stroke-width="1.35" stroke-linecap="round"/>
    <g fill="#d4a017" stroke="#9f6b08" stroke-width="0.34">
      <ellipse cx="17" cy="98" rx="2.25" ry="6.3" transform="rotate(-43 17 98)"/>
      <ellipse cx="23" cy="89" rx="2.05" ry="5.6" transform="rotate(31 23 89)" fill="#e3b32c"/>
      <ellipse cx="14" cy="81" rx="2.18" ry="6" transform="rotate(-50 14 81)"/>
      <ellipse cx="22" cy="71" rx="1.95" ry="5.35" transform="rotate(25 22 71)" fill="#e3b32c"/>
      <ellipse cx="14" cy="62" rx="2.05" ry="5.7" transform="rotate(-56 14 62)"/>
      <ellipse cx="21" cy="52" rx="1.85" ry="5.1" transform="rotate(18 21 52)" fill="#e3b32c"/>
      <ellipse cx="16" cy="43" rx="1.92" ry="5.25" transform="rotate(-63 16 43)"/>
      <ellipse cx="23" cy="32" rx="1.72" ry="4.65" transform="rotate(-70 23 32)" fill="#e3b32c"/>
      <ellipse cx="83" cy="98" rx="2.25" ry="6.3" transform="rotate(43 83 98)"/>
      <ellipse cx="77" cy="89" rx="2.05" ry="5.6" transform="rotate(-31 77 89)" fill="#e3b32c"/>
      <ellipse cx="86" cy="81" rx="2.18" ry="6" transform="rotate(50 86 81)"/>

// ── 种下动画 ──
function resetEl(el) { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; }

function playPlant() {
  const scene = document.getElementById('pa-scene');
  const seedEl   = document.getElementById('pa-seed');
  const sproutEl = document.getElementById('pa-sprout');
  const ripple   = document.getElementById('pa-ripple');

  seedEl.innerHTML   = wheatSVG(0, 24, 42, false);
  sproutEl.innerHTML = wheatSVG(1, 24, 42, false);
  [seedEl, sproutEl, ripple].forEach(resetEl);
  scene.classList.remove('running');
  void scene.offsetWidth;
  scene.classList.add('running');

  document.getElementById('play-plant-btn').disabled = true;
  setTimeout(() => { document.getElementById('play-plant-btn').disabled = false; }, 2600);
}

// ── 六阶段生长 ──
const STAGES = [
  { label: '刚种下',   time: '0 – 2 小时' },
  { label: '破土而出', time: '2 – 4 小时' },
  { label: '嫩芽初现', time: '4 – 8 小时' },
  { label: '拔节生长', time: '8 – 16 小时' },
  { label: '抽穗成形', time: '16 – 24 小时' },
  { label: '金穗丰收', time: '满 24 小时 ✨' },
];

let activeStage = 0;
let autoTimer   = null;

function renderStages() {
  const row = document.getElementById('stages-row');
  row.innerHTML = STAGES.map((s, i) => {
    const isActive = i === activeStage;
    const isGold   = i === 5;
    const svgH     = isActive ? 88 : 68;
    const svgW     = Math.round(svgH * 24 / 56);
    return `<div class="stage-card ${isActive?'active':''} ${isGold?'gold':''}" onclick="setStage(${i})">
      <div class="stage-box">${wheatSVG(i, svgW, svgH, isGold && isActive)}</div>
      <div class="stage-name">${s.label}</div>
      <div class="stage-time">${s.time}</div>
    </div>`;
  }).join('');

  const pct = (activeStage / 5) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
}

function setStage(i) {
  clearInterval(autoTimer);
  autoTimer = null;
  activeStage = i;
  renderStages();
}

function nextStage() {
  clearInterval(autoTimer); autoTimer = null;
  activeStage = Math.min(5, activeStage + 1);
  renderStages();
}
function prevStage() {
  clearInterval(autoTimer); autoTimer = null;
  activeStage = Math.max(0, activeStage - 1);
  renderStages();
}

function autoPlayStages() {
  clearInterval(autoTimer);
  activeStage = 0;
  renderStages();
  autoTimer = setInterval(() => {
    activeStage++;
    renderStages();
    if (activeStage >= 5) { clearInterval(autoTimer); autoTimer = null; }
  }, 900);
}

// ── 书架卡片演示 ──
function renderCards() {
  const row = document.getElementById('card-row');
  // 展示5个卡片：无徽章、阶段0、阶段2、阶段4、阶段5（金穗丰收）
  const cards = [
    { label: '未发布',     idx: -1 },
    { label: '刚种下',     idx: 0  },
    { label: '嫩芽初现',   idx: 2  },
    { label: '抽穗成形',   idx: 4  },
    { label: '金穗丰收',   idx: 5  },
  ];
  row.innerHTML = cards.map((c, n) => {
    const isHarvest = c.idx === 5;
    const badgeHtml = c.idx >= 0
      ? `<div class="book-badge">${wheatSVG(c.idx, 20, 40, isHarvest)}</div>`
      : '';
    const frameHtml = isHarvest ? harvestFrameSVG() : '';

    return `<div class="demo-book">
      <div class="demo-book-cover ${isHarvest?'harvest':''}">
        <div class="demo-book-num">0${n+1}</div>
        ${frameHtml}
        ${badgeHtml}
      </div>
      <div class="demo-book-label">${c.label}</div>
    </div>`;
  }).join('');
}

// ── 初始化 ──
playPlant();
renderStages();
renderCards();
autoPlayStages();
</script>
